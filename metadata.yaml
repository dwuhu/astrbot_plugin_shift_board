name: astrbot_plugin_shift_board
display_name: 排班工坊 · 工时与工薪
short_desc: 月休 4/6/8 天排班表 + 首次打卡前未上班/请假不计薪 + 月薪按在职天数折算 + 打卡工时 + 时薪/月薪核算 + 每月自定义扣款环形图 + 加班提醒 + 独立休息日提醒 + AI 联网天气 + 16 个 AI 工具
desc: 按月休 4/6/8 天自动生成排班表，也可以口头点名「5、14、18、25 号休息」按指定日期排；首次打卡之前的日期自动显示「未上班」，也可用 `/排班 请假` 或后台日历手动标记未上班/请假，这些天不计薪，月薪按实际在职工作日折算；支持上班/下班打卡、单条补录、AI 批量补一段日期的历史打卡、工时汇总、时薪或月薪核算（支持口头设置月薪/时薪）、罚款扣款、每月固定扣款（房租/社保/水电/伙食等标签完全自定义，可设每月或仅本月，后台用环形图看占比）；每日超过标准工时（默认 8 小时）自动算加班并单独推加班提醒，标准工时、加班倍率、提醒开关都可按人设置；工作日上下班温柔提醒，独立「休息日提醒」只在前一天排班上班、后一天排休时提醒，周六周日排班写着上班不会误报；提醒文案可按人自定义占位符，设置城市后由 AI 联网搜索天气并写进提醒；发送「/排班 帮助」会生成一张液态玻璃风格的图文使用手册。注册 16 个 LLM 工具供机器人 AI 直接查询与口头写入排班、月薪/时薪、标准工时与加班设置、每月扣款、提醒文案、天气城市、罚款、打卡和删除打卡。每个人按「平台 + 账号」独立存数据，附带液态玻璃风格的 WebUI 排班日历、工时看板与费用构成环形图，可上传自定义背景，后台支持整库 JSON 备份导出/导入与打卡 CSV 批量导入。
