name: astrbot_plugin_shift_board
display_name: 排班工坊 · 工时与工薪
short_desc: 月休 4/6/8 天排班 + 按月工资档案（实习/正式分开）+ 实时工时、距下班剩余 + 重叠打卡自动去重 + 发薪中心（应发/已到账/未发、月底或压一月发、到点提醒）+ 今日考勤/整月排班超清图（天气图标与温度、时段问候、今日进度灯带、今天已获得） + 实际年收入按出勤累计 + 打卡 + 扣款 + 提醒（天气与添衣建议） + 22 个 AI 工具
desc: 按月休 4/6/8 天自动生成排班表，也可以口头点名「5、14、18、25 号休息」按指定日期排；首次打卡之前的日期自动显示「未上班」，也可用 `/排班 请假` 或后台日历手动标记未上班/请假，这些天不计薪，月薪按实际在职工作日折算；工资按月独立存档，10 月 3000、11 月 5000 互不覆盖，实习期与正式期按月份分开统计；支持上班/下班打卡、单条补录、AI 批量补一段日期的历史打卡、同一天重叠打卡按时间区间自动去重、今天未到的下班时间不会被提前计入、实时显示现在几点、今天已上多久和距下班还剩多久、工时汇总、时薪或月薪核算（支持口头设置月薪/时薪并按月份指定）、罚款扣款、每月固定扣款（房租/社保/水电/伙食等标签完全自定义，可设每月或仅本月，后台用环形图看占比）；年收入只按已经打卡上班的天数累计，未来班表不提前算钱，并区分实习/正式；每日超过标准工时（默认 8 小时）自动算加班并单独推加班提醒，标准工时、加班倍率、提醒开关都可按人设置；新增「发薪中心」：每月工资可查应发、已到账、未发，支持「当月月底发」与「压一月 · 次月指定日期发」随时切换，登记部分或全额到账、撤销到账，WebUI 发薪卡片与排班日历直接标出发薪金额 / 未发，发薪日到点主动提醒「工资到账没有」；发送「/今日考勤」单独生成一张考勤图，显示今天上了多久、今天按时薪实时赚了多少、距下班多久、本月与上月应发 / 未发合计、还要上多久；今日考勤图与整月排班图右上角显示天气图标和温度（不显示城市），并按早上/中午/下午/晚上给出「吃饭了吗 / 还有多久下班」等问候；排班图今天这一格用黄色高亮，边框有一圈按「今天已上 / 今日班次总时长」实时走的进度灯带，已完成绿色、未上班蓝色；上下班提醒带天气与「天冷了记得加衣」；排班图与帮助图默认约 1080P、最高不超过 1.5K，字体与背景对比度加强。注册 22 个 LLM 工具供机器人 AI 直接查询与口头写入排班、月薪/时薪、工资阶段、发薪规则与到账登记、标准工时与加班设置、每月扣款、提醒文案、天气城市、罚款、打卡、删除打卡、今日考勤图、整月排班图和年收入。每个人按「平台 + 账号」独立存数据，附带液态玻璃风格的 WebUI 排班日历、工时看板、按月工资档案与费用构成环形图，可上传自定义背景，后台支持整库 JSON 备份导出/导入与打卡 CSV 批量导入。
